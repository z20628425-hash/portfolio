name: Prezent Prep Hub CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Type Check & Linting
        run: npm run lint

      - name: Run Automated Test Suites (N12)
        run: npm test

      - name: Build Production Bundle
        run: npm run build
        env:
          NODE_ENV: production
